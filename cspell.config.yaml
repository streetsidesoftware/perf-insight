$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
ignorePaths:
  - .git/{FETCH_HEAD,HEAD,index,packed-refs,config}
  - .git/info
  - .git/*/*/**
  - .gitattributes
  - .gitignore
  - .prettierignore
  - .vscode
  - '*-lock.*'
  - '*.lock'
  - '*.sample'
  - /coverage
  - /dist
  - CHANGELOG.md
  - cspell.config.*
  - node_modules
  - '*.tsv'
  - ngram/**/*.json
enableGlobDot: true
useGitignore: true
# In a git worktree, `.git` is a file holding the path to the worktree's git directory.
# Do not spell check it. The `.git` glob also matches the files inside a `.git` directory,
# so the second entry turns the check back on for them. Its glob must end in `.git/`:
# `.git/**` also matches the worktree's `.git` file. The order matters.
# See https://github.com/streetsidesoftware/cspell/issues/9590
overrides:
  - filename: '.git'
    enabled: false
  - filename: '.git/'
    enabled: true
dictionaryDefinitions: []
dictionaries: []
words:
  - autobuild
  - buildscript
  - bunx
  - codecov
  - codeql
  - coverallsapp
  - denoland
  - esbuild
  - lcov
  - ngram
  - pnpm
  - Positionals
  - unstub
  - vitest
ignoreWords: []
import: []
